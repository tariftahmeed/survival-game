<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Side‑Scrolling Runner</title>

<!-- Mobile viewport -->
<meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no">

<!-- ---- PWA / Icon meta tags (reuse the same ones you used before) ---- -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4a90e2">

<style>
/* ------------------- BASIC PAGE STYLE ------------------- */
html,body { height:100%; margin:0; padding:0; background:#fafafa; font-family:sans-serif; }
body { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }

/* ------------------- HEADER ------------------- */
header {
  width:100%; background:#4a90e2; color:#fff; text-align:center;
  padding:0.6rem 0; font-size:1.2rem;
}
#score { font-weight:bold; }

/* ------------------- CANVAS ------------------- */
canvas {
  background:#87ceeb;               /* sky */
  display:block;
  margin-top:10px;
  border:2px solid #333;
}

/* ------------------- OVERLAY (Game Over) ------------------- */
#overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.7); color:#fff;
  display:none; align-items:center; justify-content:center;
  flex-direction:column; text-align:center; padding:1rem;
}
#overlay button { margin-top:1rem; padding:.6rem 1.2rem; font-size:1rem; cursor:pointer; }
</style>
</head>

<body>
<header>
  🏃‍♂️ Runner – Score: <span id="score">0</span> s
</header>

<canvas id="game" width="360" height="480"></canvas>

<div id="overlay">
  <div id="msg"></div>
  <button onclick="startGame()">Play again</button>
</div>

<script>
/* ====================== CONFIG ====================== */
const GRAVITY        = 0.6;    // pixel per frame²
const JUMP_VELOCITY  = -12;   // pixel per frame (negative = up)
const GROUND_HEIGHT  = 80;    // distance from bottom of canvas
const OBSTACLE_FREQ  = 1500;  // ms between obstacles (average)
const OBSTACLE_SPEED = 4;     // pixels per frame (leftward)
const PLAYER_SIZE    = 40;    // square side length

/* ====================== STATE ====================== */
let canvas, ctx;
let player, obstacles, lastObstacleTime, animationId;
let score = 0, startTime = 0;
let gameRunning = false;

/* ====================== OBJECTS ====================== */
function resetGameObjects() {
  player = {
    x: 60,
    y: canvas.height - GROUND_HEIGHT - PLAYER_SIZE,
    vy: 0,
    width: PLAYER_SIZE,
    height: PLAYER_SIZE,
    color: '#ffcc00'          // runner color
  };
  obstacles = [];            // each obs: {x,width,height}
  lastObstacleTime = 0;
}

/* ====================== DRAW ====================== */
function drawGround() {
  ctx.fillStyle = '#654321';
  ctx.fillRect(0, canvas.height - GROUND_HEIGHT,
               canvas.width, GROUND_HEIGHT);
}

function drawPlayer() {
  ctx.fillStyle = player.color;
  ctx.fillRect(player.x, player.y, player.width, player.height);
}

function drawObstacles() {
  ctx.fillStyle = '#e53935';
  obstacles.forEach(o => {
    ctx.fillRect(o.x, canvas.height - GROUND_HEIGHT - o.height,
                 o.width, o.height);
  });
}

/* ====================== UPDATE ====================== */
function updatePlayer() {
  // apply gravity
  player.vy += GRAVITY;
  player.y += player.vy;

  // floor collision
  const floorY = canvas.height - GROUND_HEIGHT - player.height;
  if (player.y > floorY) {
    player.y = floorY;
    player.vy = 0;
  }
}

function spawnObstacle() {
  // Random width & height for a little variety
  const w = 20 + Math.random() * 30;   // 20‑50px
  const h = 20 + Math.random() * 40;   // 20‑60px
  obstacles.push({
    x: canvas.width,
    width: w,
    height: h
  });
}

function updateObstacles(delta) {
  // move left
  obstacles.forEach(o => o.x -= OBSTACLE_SPEED);

  // remove off‑screen
  obstacles = obstacles.filter(o => o.x + o.width > 0);
}

/* --------------------- COLLISION --------------------- */
function checkCollision() {
  for (let o of obstacles) {
    const playerRect = {
      left:   player.x,
      right:  player.x + player.width,
      top:    player.y,
      bottom: player.y + player.height
    };
    const obsRect = {
      left:   o.x,
      right:  o.x + o.width,
      top:    canvas.height - GROUND_HEIGHT - o.height,
      bottom: canvas.height - GROUND_HEIGHT
    };
    const overlap = !(playerRect.right  < obsRect.left ||
                      playerRect.left   > obsRect.right ||
                      playerRect.bottom < obsRect.top ||
                      playerRect.top    > obsRect.bottom);
    if (overlap) return true;
  }
  return false;
}

/* ====================== INPUT ====================== */
function handleJump() {
  // Only allow jump when on ground (vy===0)
  if (player.vy === 0) player.vy = JUMP_VELOCITY;
}
function setupInput() {
  // mouse / tap
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    handleJump();
  });
  // keyboard (space or up arrow) – useful on desktop
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      handleJump();
    }
  });
}

/* ====================== MAIN LOOP ====================== */
let lastTimestamp = 0;
function loop(timestamp) {
  if (!gameRunning) return;               // safety

  const delta = timestamp - lastTimestamp;
  lastTimestamp = timestamp;

  // ==== TIME & SCORE ==== //
  const now = Date.now();
  score = Math.floor((now - startTime) / 1000);
  document.getElementById('score').textContent = score;

  // ==== CLEAR ==== //
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // ==== DRAW GROUND ==== //
  drawGround();

  // ==== UPDATE PLAYER ==== //
  updatePlayer();
  drawPlayer();

  // ==== OBSTACLES ==== //
  // spawn based on time (average frequency)
  if (now - lastObstacleTime > OBSTACLE_FREQ * (0.5 + Math.random())) {
    spawnObstacle();
    lastObstacleTime = now;
  }
  updateObstacles(delta);
  drawObstacles();

  // ==== COLLISION ==== //
  if (checkCollision()) {
    endGame();
    return;
  }

  // request next frame
  animationId = requestAnimationFrame(loop);
}

/* ====================== START / END ====================== */
function startGame() {
  // reset UI
  document.getElementById('overlay').style.display = 'none';
  score = 0;
  startTime = Date.now();

  // reset objects
  resetGameObjects();

  // start loop
  gameRunning = true;
  lastTimestamp = performance.now();
  animationId = requestAnimationFrame(loop);
}
function endGame() {
  gameRunning = false;
  cancelAnimationFrame(animationId);
  const msg = document.getElementById('msg');
  msg.innerHTML = `💥 Game Over!<br>Your score: <strong>${score}</strong> seconds`;
  document.getElementById('overlay').style.display = 'flex';
}

/* ====================== INITIALISATION ====================== */
window.addEventListener('load', () => {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');

  // make the canvas fill the screen width on phones (max width 360)
  const resize = () => {
    const maxW = 360;
    const vw = Math.min(window.innerWidth, maxW);
    canvas.style.width = vw + 'px';
    canvas.style.height = (vw * canvas.height / canvas.width) + 'px';
  };
  resize();
  window.addEventListener('resize', resize);

  setupInput();
  startGame();                // auto‑start on load
});

/* ====================== OPTIONAL SERVICE‑WORKER ====================== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .catch(e => console.warn('SW registration failed', e));
}
</script>
</body>
</html>

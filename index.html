<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Top Down Survival Mobile</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center}

/* ------- HEADER (score + player name) ------- */
header{
  width:100%;background:#223;color:#fff;text-align:center;
  padding:10px;font-size:20px;position:relative;
}

/* place the leaderboard in the upper‑right corner of the page (outside the header) */
#leaderboard{
  position:fixed;top:10px;right:10px;
  background:rgba(0,0,0,.6);color:#fff;
  padding:6px 10px;border-radius:6px;
  font-size:0.85rem;line-height:1.3;
}
#leaderboard h3{margin:0 0 4px 0;font-size:0.95rem;text-align:center}
#leaderboard ol{margin:0;padding-left:20px}

/* ------- CANVAS ------- */
canvas{
  background:#4caf50;border:2px solid #222;touch-action:none;
  flex:1;max-width:100%;margin-top:4px;
}

/* ------- GAME OVER OVERLAY ------- */
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.85);
  display:none;justify-content:center;align-items:center;
  flex-direction:column;color:#fff;text-align:center;
}
button{padding:12px 22px;font-size:18px;cursor:pointer}

/* make the canvas keep its original aspect ratio on resize */
</style>
</head>

<body>
<header>
  🎮 Survival – <span id="playerLabel">Player: <strong id="playerName"></strong></span>
  &nbsp;|&nbsp;Score: <span id="score">0</span>
</header>

<!-- leaderboard sits in the top‑right of the whole page -->
<div id="leaderboard">
  <h3>Top 3</h3>
  <ol id="topList"></ol>
</div>

<canvas id="game" width="480" height="700"></canvas>

<div id="overlay"><h1>Game Over</h1><p id="final"></p><button onclick="startGame()">Play Again</button></div>

<script>
/* ==============================================================
   CONFIG & GLOBALS
   ============================================================== */
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');

let player,               // {x,y,w,h,speed}
    enemies = [],        // array of enemy objects
    score = 0,
    startTime = 0,
    lastSpawn = 0,
    running = false,
    anim,
    playerName = '';      // will be filled after prompt

/* joystick for mobile (unchanged) */
const joystick = {active:false,baseX:0,baseY:0,dx:0,dy:0,max:60};

/* ==============================================================
   PLAYER / NAME -------------------------------------------------
   ============================================================== */
function askForName(){
  // First try to read a stored name – if the player already entered one before,
  // we keep it so they don’t have to type it each session.
  const stored = localStorage.getItem('survivalPlayerName');
  if(stored){ playerName = stored; }
  else{
    // Ask with a simple prompt (you could replace this by a custom modal if you prefer)
    let name = '';
    while(!name){ name = prompt('Enter your name (this will appear on the leaderboard)'); }
    playerName = name.trim();
    localStorage.setItem('survivalPlayerName', playerName);
  }
  document.getElementById('playerName').textContent = playerName;
}

/* ==============================================================
   LEADERBOARD ---------------------------------------------------
   ============================================================== */
function loadLeaderboard(){
  const raw = localStorage.getItem('survivalTop3');
  return raw ? JSON.parse(raw) : [];   // array of {name,score}
}
function saveLeaderboard(arr){
  localStorage.setItem('survivalTop3', JSON.stringify(arr));
}
function updateLeaderboardUI(){
  const topList = document.getElementById('topList');
  topList.innerHTML = '';                     // clear current list
  const board = loadLeaderboard();
  board.forEach(entry=>{
    const li = document.createElement('li');
    li.textContent = `${entry.name}: ${entry.score}s`;
    topList.appendChild(li);
  });
}

/* After every game‑over we insert the new score, keep only the best three */
function pushScoreToLeaderboard(){
  const board = loadLeaderboard();
  board.push({name: playerName, score});
  board.sort((a,b)=>b.score - a.score);   // descending
  if(board.length>3) board.length = 3;    // keep only top‑3
  saveLeaderboard(board);
  updateLeaderboardUI();
}

/* ==============================================================
   GAME SETUP ----------------------------------------------------
   ============================================================== */
function reset(){
  player = {x:220, y:330, w:30, h:30, speed:4.5};
  enemies = [];
}

/* spawn an enemy from a random side */
function spawnEnemy(){
  const side = Math.floor(Math.random()*4);
  let x, y;
  if(side===0){ x=Math.random()*canvas.width; y=-30; }               // top
  if(side===1){ x=canvas.width+30; y=Math.random()*canvas.height; }   // right
  if(side===2){ x=Math.random()*canvas.width; y=canvas.height+30; }   // bottom
  if(side===3){ x=-30; y=Math.random()*canvas.height; }               // left
  enemies.push({x, y, w:24, h:24, s:1.6});
}

/* move player according to joystick */
function updatePlayer(){
  if(joystick.active){
    const mag = Math.hypot(joystick.dx, joystick.dy);
    if(mag>2){
      player.x += (joystick.dx/mag) * player.speed;
      player.y += (joystick.dy/mag) * player.speed;
    }
  }
  // stay inside canvas
  player.x = Math.max(0, Math.min(canvas.width-player.w, player.x));
  player.y = Math.max(0, Math.min(canvas.height-player.h, player.y));
}

/* enemies chase the player */
function updateEnemies(){
  enemies.forEach(e=>{
    const dx = player.x - e.x,
          dy = player.y - e.y,
          d  = Math.hypot(dx,dy) || 1;
    e.x += (dx/d) * e.s;
    e.y += (dy/d) * e.s;
  });
}

/* --------‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‑‐
   ENEMY‑ENEMY COLLISION : when two red squares touch each other both disappear
   --------------------------------------------------------------------------- */
function handleEnemyCollisions(){
  const toRemove = new Set();               // indices that will be deleted
  for(let i=0;i<enemies.length;i++){
    for(let j=i+1;j<enemies.length;j++){
      const a = enemies[i], b = enemies[j];
      if(a.x < b.x+b.w && a.x+a.w > b.x &&
         a.y < b.y+b.h && a.y+a.h > b.y){
        toRemove.add(i);
        toRemove.add(j);
      }
    }
  }
  enemies = enemies.filter((_,idx)=>!toRemove.has(idx));
}

/* player‑enemy collision ends the game */
function collide(){
  return enemies.some(e=>
    player.x < e.x+e.w && player.x+player.w > e.x &&
    player.y < e.y+e.h && player.y+player.h > e.y);
}

/* --------------------------------------------------------------- DRAW --------------------------------------------------------------- */
function draw(){
  // background + optional grid
  ctx.fillStyle='#4caf50';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='rgba(255,255,255,.08)';
  for(let x=0;x<canvas.width;x+=40){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
  }
  for(let y=0;y<canvas.height;y+=40){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
  }

  // player (gold square)
  ctx.fillStyle='gold';
  ctx.fillRect(player.x,player.y,player.w,player.h);

  // enemies (red squares)
  ctx.fillStyle='#e53935';
  enemies.forEach(e=>ctx.fillRect(e.x,e.y,e.w,e.h));

  // joystick visual aid (optional)
  if(joystick.active){
    ctx.beginPath();
    ctx.strokeStyle='rgba(255,255,255,.4)';
    ctx.lineWidth=3;
    ctx.arc(joystick.baseX, joystick.baseY, 40,0,Math.PI*2);
    ctx.stroke();

    ctx.beginPath();
    ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.arc(joystick.baseX+joystick.dx,
            joystick.baseY+joystick.dy,20,0,Math.PI*2);
    ctx.fill();
  }
}

/* --------------------------------------------------------------- MAIN LOOP --------------------------------------------------------------- */
function loop(timestamp){
  if(!running) return;

  // update score display
  score = Math.floor((Date.now()-startTime)/1000);
  document.getElementById('score').textContent = score;

  // spawn a new enemy every ~1.2 s
  if(timestamp - lastSpawn > 1200){
    spawnEnemy();
    lastSpawn = timestamp;
  }

  // physics
  updatePlayer();
  updateEnemies();
  handleEnemyCollisions();     // <‑‑ NEW LINE

  // render
  draw();

  // check for game‑over
  if(collide()){
    running = false;
    cancelAnimationFrame(anim);
    document.getElementById('final').textContent =
        'You survived '+score+' seconds';
    document.getElementById('overlay').style.display='flex';
    pushScoreToLeaderboard();   // <‑‑ store the result
    return;
  }

  anim = requestAnimationFrame(loop);
}

/* --------------------------------------------------------------- START / RESTART --------------------------------------------------------------- */
function startGame(){
  // ask for name only the very first time (or reuse stored name)
  if(!playerName) askForName();

  document.getElementById('overlay').style.display='none';
  score = 0;
  startTime = Date.now();
  lastSpawn = 0;
  reset();
  running = true;
  requestAnimationFrame(loop);
}

/* --------------------------------------------------------------- JOYSTICK INPUT --------------------------------------------------------------- */
function pos(e){
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * canvas.width / r.width,
    y: (e.clientY - r.top)  * canvas.height/ r.height
  };
}
canvas.addEventListener('pointerdown',e=>{
  const p = pos(e);
  // left half of the screen = joystick activation
  if(p.x < canvas.width/2){
    joystick.active = true;
    joystick.baseX = p.x; joystick.baseY = p.y;
    joystick.dx = joystick.dy = 0;
  }
});
canvas.addEventListener('pointermove',e=>{
  if(!joystick.active) return;
  const p = pos(e);
  let dx = p.x - joystick.baseX,
      dy = p.y - joystick.baseY;
  const d = Math.hypot(dx,dy);
  if(d > joystick.max){
    dx = dx/d * joystick.max;
    dy = dy/d * joystick.max;
  }
  joystick.dx = dx; joystick.dy = dy;
});
canvas.addEventListener('pointerup',()=>{ joystick.active=false; joystick.dx=0; joystick.dy=0; });
canvas.addEventListener('pointercancel',()=>{ joystick.active=false; });

/* --------------------------------------------------------------- RESPONSIVE CANVAS (keeps 480×700 aspect) --------------------------------------------------------------- */
function resize(){
  const maxW = Math.min(window.innerWidth,480);
  canvas.style.width  = maxW+'px';
  canvas.style.height = (maxW * 700 / 480)+'px';
}
window.addEventListener('resize',resize);
resize();

/* --------------------------------------------------------------- INITIAL LOAD --------------------------------------------------------------- */
window.addEventListener('load',()=>{
  // try to load a stored player name (if the player never played before, this does nothing)
  const stored = localStorage.getItem('survivalPlayerName');
  if(stored){ playerName = stored; document.getElementById('playerName').textContent = playerName; }

  // draw the current leaderboard (if any)
  updateLeaderboardUI();

  // start the first game automatically
  startGame();
});

/* --------------------------------------------------------------- OPTIONAL SERVICE‑WORKER --------------------------------------------------------------- */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js')
    .catch(e=>console.warn('SW registration failed',e));
}
</script>
</body>
</html>

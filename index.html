<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Whack‑a‑Mole (tiny JS game)</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fafafa;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    padding: 20px;
  }
  h1 { margin: 0.2em 0; }
  #info { margin-bottom: 10px; }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 8px;
  }
  .hole {
    width: 100px;
    height: 100px;
    background: #6c757d;
    border-radius: 50%;
    position: relative;
    cursor: pointer;
    box-shadow: inset 0 0 10px #0003;
  }
  .mole {
    width: 70px;
    height: 70px;
    background: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><path fill=%22%23733%22 d=%22M32 2c-8.8 0-16 7.2-16 16 0 8.8 7.2 16 16 16s16-7.2 16-16c0-8.8-7.2-16-16-16zm0 28c-8.8 0-24 4.5-24 13.3V60h48V43.3c0-8.8-15.2-13.3-24-13.3z%22/></svg>') center/contain no-repeat;
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translate(-50%, 15%);
    transition: transform 0.1s;
  }
  .hole.active .mole { transform: translate(-50%, -30%); } /* mole pops up */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    display: none;
    flex-direction: column;
  }
  button { padding: .5em 1em; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
<h1>Whack‑a‑Mole</h1>
<div id="info">
  Score: <span id="score">0</span> &nbsp;|&nbsp;
  Time left: <span id="time">30</span>s
</div>

<div id="board">
  <!-- 9 holes will be generated by JS -->
</div>

<div id="overlay">
  <div id="msg"></div>
  <button onclick="startGame()">Play again</button>
</div>

<script>
/* ---------- configuration ---------- */
const GAME_TIME   = 30;   // seconds the player has
const POP_DURATION = 800; // how long a mole stays up (ms)
const MIN_DELAY   = 300; // shortest time before next mole (ms)
const MAX_DELAY   = 1200;// longest time before next mole (ms)

/* ---------- state ---------- */
let score = 0;
let timeLeft = GAME_TIME;
let timerId = null;
let moleTimeout = null;

/* ---------- DOM refs ---------- */
const board   = document.getElementById('board');
const scoreEl = document.getElementById('score');
const timeEl  = document.getElementById('time');
const overlay = document.getElementById('overlay');
const msg     = document.getElementById('msg');

/* ---------- build the board ---------- */
for (let i = 0; i < 9; i++) {
  const hole = document.createElement('div');
  hole.className = 'hole';
  hole.dataset.index = i; // handy for debugging
  const mole = document.createElement('div');
  mole.className = 'mole';
  hole.appendChild(mole);
  board.appendChild(hole);
}

/* ---------- helpers ---------- */
function randomHole() {
  const holes = document.querySelectorAll('.hole');
  return holes[Math.floor(Math.random() * holes.length)];
}
function randomDelay() {
  return Math.random() * (MAX_DELAY - MIN_DELAY) + MIN_DELAY;
}

/* ---------- game loop ---------- */
function popMole() {
  const hole = randomHole();
  hole.classList.add('active');          // mole pops up

  // If the player clicks while the mole is up → score!
  const clickHandler = (e) => {
    if (hole.classList.contains('active')) {
      score++;
      scoreEl.textContent = score;
      // hide early
      hideMole();
    }
  };
  hole.addEventListener('click', clickHandler, {once: true});

  // hide the mole after POP_DURATION unless the player already whacked it
  moleTimeout = setTimeout(hideMole, POP_DURATION);

  function hideMole() {
    hole.classList.remove('active');
    // clean up any pending timeout for this mole
    clearTimeout(moleTimeout);
    // schedule the next one (as long as time remains)
    if (timeLeft > 0) {
      setTimeout(popMole, randomDelay());
    }
  }
}

/* ---------- timer ---------- */
function startTimer() {
  timeEl.textContent = timeLeft;
  timerId = setInterval(() => {
    timeLeft--;
    timeEl.textContent = timeLeft;
    if (timeLeft <= 0) endGame();
  }, 1000);
}

/* ---------- start / end ---------- */
function startGame() {
  // reset state
  score = 0;
  timeLeft = GAME_TIME;
  scoreEl.textContent = score;
  timeEl.textContent = timeLeft;
  overlay.style.display = 'none';

  // start loops
  startTimer();
  popMole(); // first mole appears after a short random delay
}

function endGame() {
  // stop everything
  clearInterval(timerId);
  clearTimeout(moleTimeout);
  document.querySelectorAll('.hole').forEach(h => h.classList.remove('active'));

  // show overlay
  msg.textContent = `Time's up! Your final score is ${score}.`;
  overlay.style.display = 'flex';
}

/* ---------- launch ---------- */
startGame();   // automatically begin when the page loads
</script>
</body>
</html>

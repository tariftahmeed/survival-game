<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=0.9,maximum-scale=0.9,user-scalable=no,viewport-fit=cover">
<title>Hungry Reds</title>

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center}
header{width:100%;background:#223;color:#fff;text-align:center;padding:10px;font-size:20px;position:relative}
#leaderboard{position:fixed;top:30px;right:15px;background:rgba(0,0,0,.1);color:#fff;padding:6px 10px;border-radius:6px;font-size:0.85rem;line-height:1.3}
#leaderboard h3{margin:0 0 4px 0;font-size:0.95rem;text-align:center}
#leaderboard ol{margin:0;padding-left:20px}
canvas{
  background:#4caf50;
  border:2px solid #222;
  touch-action:none;
  flex:1;
  max-width:100%;
  margin-top:4px
}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:center;flex-direction:column;color:#fff;text-align:center}
button{padding:12px 22px;font-size:18px;cursor:pointer}

/* ---------- KING DIALOGUE POP‑UP ---------- */
#dialogueBox{
  position:fixed; inset:0;
  background:rgba(0,0,0,.75);
  display:flex; justify-content:center; align-items:center;
  z-index:9999;
}
.dialogueContent{
  background:#2c3e50;
  padding:20px 30px;
  border-radius:8px;
  max-width:80%;
  text-align:center;
  color:#ecf0f1;
  font-family:Arial,Helvetica,sans-serif;
}
.dialogueContent h2{margin:0 0 .6rem; font-size:1.8rem;}
.dialogueContent p{margin:0 0 1.2rem; font-size:1.2rem; line-height:1.4;}
.dialogueContent button{
  background:#27ae60; border:none; color:#fff;
  padding:8px 16px; font-size:1rem; border-radius:4px;
  cursor:pointer;
}
.dialogueContent button:hover{background:#2ecc71;}
</style>
</head>

<body>
<header>
  🎮 Survival – <span id="playerLabel">Player: <strong id="playerName"></strong></span>
  &nbsp;|&nbsp;Score: <span id="score">0</span>
</header>

<div id="leaderboard">
  <h3>Top 3</h3>
  <ol id="topList"></ol>
</div>

<canvas id="game" width="540" height="1170"></canvas>

<!-- ---------- KING DIALOGUE BOX (hidden until needed) ---------- -->
<div id="dialogueBox" style="display:none;">
  <div class="dialogueContent">
    <h2>🤴 The King</h2>
    <p id="dialogueLine"></p>
    <button id="dialogueNext">Next</button>
  </div>
</div>

<div id="overlay"><h1>Game Over</h1><p id="final"></p><button id="retry">Play Again</button></div>

<!-- ====================== FIREBASE & FIRESTORE ====================== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  limit,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

/* ---------- GLOBALS ------------------------------------------------- */
let dlgBtn;                     // will be set after the page loads
let gamePaused = false;        // pause while dialogue is shown

/* ---------- GLOBAL HEALTH VARIABLES ---------- */
const MAX_HEALTH   = 3;            // you can raise this if you want more “HP”
let playerHealth   = MAX_HEALTH;    // current HP – starts full but hidden
let showHealthBar  = false;        // true → draw the bar

/* DAMAGE SETTINGS */
const INVULN_TIME = 800; // milliseconds of immunity after a hit
let playerInvuln = 0; // counts down while the player is immune
      
/* ---------- KING NPC (inside buildingC) ---------- */
let king = {
  x:0, y:0,
  w:40, h:60,
  emoji:'🤴',
  dialogueLines:[
    "Welcome, brave hero!",
    "Your deeds have echoed across the realm.",
    "Take this gift and continue your quest."
  ],
  currentLine:0,
  /* NEW --------------------------------------------------- */
  active:false,          // true while the UI is open (you already have this)
  placed:false,         // true after we have positioned the king
  talked:false          // ← **NEW** – have we already shown the conversation?
};

/* ---------- DIALOGUE HELPERS ---------- */
function startKingDialogue(){
  document.getElementById('dialogueLine').textContent = king.dialogueLines[0];
  king.currentLine = 0;
  document.getElementById('dialogueBox').style.display = 'flex';
  dlgBtn.textContent = 'Next';
  gamePaused = true;

  king.talked = true;       // <-- NEW
}
      
function advanceKingDialogue(){
  king.currentLine++;

  // ----- END OF CONVERSATION -----
  if (king.currentLine >= king.dialogueLines.length){
    document.getElementById('dialogueBox').style.display = 'none';
    gamePaused = false;
    king.active = false;
    dlgBtn.textContent = 'Next';

    // <<<--- NEW: enable and refill the health bar -----------------
    showHealthBar = true;          // make the bar appear
    playerHealth   = MAX_HEALTH;   // full health again
    // ----------------------------------------------------------------

    return;
  }

  // ----- CONTINUE TO NEXT LINE -----
  document.getElementById('dialogueLine').textContent = king.dialogueLines[king.currentLine];
  dlgBtn.textContent = (king.currentLine === king.dialogueLines.length - 1) ? 'Close' : 'Next';
}

/* ---------- YOUR FIREBASE CONFIG ---------- */
const firebaseConfig = {
  apiKey:           "AIzaSyA6QM9EX21aAG8fmlcv4_z5ZtvNblha-KM",
  authDomain:       "survival-global-lb.firebaseapp.com",
  projectId:        "survival-global-lb",
  storageBucket:    "survival-global-lb.firebasestorage.app",
  messagingSenderId:"348885828075",
  appId:            "1:348885828075:web:66ba19f95cb9347deb99ae"
};

/* ---------- INITIALISE FIREBASE & FIRESTORE ---------- */
const app   = initializeApp(firebaseConfig);
const db    = getFirestore(app);
const scoresCol = collection(db, "survivalScores");

/* ---------- LEADERBOARD HELPERS ---------- */
/* ---------- RECORD PLAY SESSION (date+time) ---------- */
async function recordPlaySession(name, kills){
  try {
    await addDoc(scoresCol, {
      name,                // player name
      score: kills,        // final kills / score
      playedAt: serverTimestamp()   // <-- Firestore‑generated timestamp
    });
    // optional: you could also store a formatted string for easy reading
    // const now = new Date();
    // await addDoc(scoresCol, { name, score: kills, playedAt: serverTimestamp(),
    //                           playedOn: now.toISOString() });
  } catch (e){
    console.warn('Failed to write play session:', e);
  }
}
async function fetchTop3(){
  const q    = query(scoresCol, orderBy("score","desc"), limit(3));
  const snap = await getDocs(q);
  const list = [];
  snap.forEach(doc=>{ const d = doc.data(); list.push({name:d.name, score:d.score}); });
  return list;
}
async function refreshLeaderboard(){
  const top = await fetchTop3();
  const ol = document.getElementById('topList');
  ol.innerHTML = "";
  top.forEach(entry=>{
    const li = document.createElement('li');
    li.textContent = `${entry.name}: ${entry.score}`;
    ol.appendChild(li);
  });
}

/* ====================== GAME CODE ====================== */
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');

let player, enemies = [], kills = 0, lastSpawn = 0, running = false, anim;
let playerName = '';
let joystick = {active:false, baseX:0, baseY:0, dx:0, dy:0, max:60};
let lastTime = 0;
let buildingCAdded = false;

/* ---- PLAYER NAME (local storage) ---- */
function askForName(){
  const stored = localStorage.getItem('survivalPlayerName');
  if(stored){ playerName = stored; }
  else{
    let name = '';
    while(!name){ name = prompt('Enter your name (will appear on the global leaderboard)'); }
    playerName = name.trim();
    localStorage.setItem('survivalPlayerName', playerName);
  }
  document.getElementById('playerName').textContent = playerName;
}

/* ---- BASIC GAME SETUP ---- */
function reset(){
      player={x:220, y:330, w:30, h:30, speed:4.5};
      enemies=[];
      kills = 0;

      // restore full health and hide the bar on fresh start
      playerHealth = MAX_HEALTH;
      showHealthBar = false;
      playerInvuln = 0;
}

function spawnEnemy(){
  const side = Math.floor(Math.random()*4);
  let x,y;
  if(side===0){ x=Math.random()*canvas.width; y=-30; }
  if(side===1){ x=canvas.width+30; y=Math.random()*canvas.height; }
  if(side===2){ x=Math.random()*canvas.width; y=canvas.height+30; }
  if(side===3){ x=-30; y=Math.random()*canvas.height; }
  enemies.push({x,y,w:24,h:24,s:1.6});
}
function updatePlayer(){
  if(joystick.active){
    const mag = Math.hypot(joystick.dx, joystick.dy);
    if(mag>2){
      player.x += (joystick.dx/mag) * player.speed;
      player.y += (joystick.dy/mag) * player.speed;
    }
  }
  player.x = Math.max(0, Math.min(canvas.width-player.w, player.x));
  player.y = Math.max(0, Math.min(canvas.height-player.h, player.y));
}
function updateEnemies(){
  enemies.forEach(e=>{
    const dx = player.x - e.x,
          dy = player.y - e.y,
          d  = Math.hypot(dx,dy) || 1;
    e.x += (dx/d) * e.s;
    e.y += (dy/d) * e.s;
  });
}

/* ---- ENEMY‑ENEMY COLLISION & KILL EFFECT ---- */
function handleEnemyCollisions(){
  const toRemove = new Set();

  for (let i=0;i<enemies.length;i++){
    for (let j=i+1;j<enemies.length;j++){
      const a=enemies[i], b=enemies[j];
      if (a.x < b.x+b.w && a.x+a.w > b.x &&
          a.y < b.y+b.h && a.y+a.h > b.y){
        toRemove.add(i); toRemove.add(j);
        const midX = (a.x + b.x) / 2 + a.w / 2;
        const midY = (a.y + b.y) / 2 + a.h / 2;
        killEffects.push({x:midX, y:midY, ttl:200});
      }
    }
  }
  kills += Math.floor(toRemove.size/2);
  enemies = enemies.filter((_,i)=>!toRemove.has(i));
}
let killEffects = []; // {x,y,ttl}
function updateKillEffects(delta){
  killEffects.forEach(e=> e.ttl -= delta);
  killEffects = killEffects.filter(e=> e.ttl>0);
}
function drawKillEffects(){
  ctx.font = '32px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ff4444';
  killEffects.forEach(e=>{
    ctx.globalAlpha = Math.max(0, e.ttl/200);
    ctx.fillText('⚔️', e.x, e.y);
  });
  ctx.globalAlpha = 1;
}

/* ---------- DRAW HEALTH BAR (top‑center of the canvas) ---------- */
function drawHealthBar(){
  if (!showHealthBar) return;          // nothing to draw

  const barW = 200;                     // total width of the bar (px)
  const barH = 20;                      // height (px)
  const x    = (canvas.width - barW) / 2;   // centre horizontally
  const y    = 12;                      // a little margin from the top

  // ---- background (dark grey) ----
  ctx.fillStyle = '#555';
  ctx.fillRect(x, y, barW, barH);

  // ---- current health (green) ----
  const curW = (playerHealth / MAX_HEALTH) * barW;
  ctx.fillStyle = '#0f0';
  ctx.fillRect(x, y, curW, barH);

  // ---- white border ----
  ctx.strokeStyle = '#fff';
  ctx.lineWidth   = 2;
  ctx.strokeRect(x, y, barW, barH);
}

/* ---- PLAYER‑ENEMY COLLISION (game over) ---- */
function collide(){
  return enemies.some(e=>
    player.x < e.x+e.w && player.x+player.w > e.x &&
    player.y < e.y+e.h && player.y+player.h > e.y);
}

/* ---------- DAMAGE CHECK (called each frame) ---------- */
function damagePlayer(delta){
  // 1️⃣  Do nothing until the health bar exists
  if (!showHealthBar) return;

  // 2️⃣  If we are currently immune, just count down the timer
  if (playerInvuln > 0){
    playerInvuln -= delta;
    return;
  }

  // 3️⃣  Test collision with every enemy
  for (const e of enemies){
    if (player.x < e.x+e.w && player.x+player.w > e.x &&
        player.y < e.y+e.h && player.y+player.h > e.y){

      // ----- we got hit! -----
      playerHealth--;               // lose one HP
      playerInvuln = INVULN_TIME;  // start the short invulnerability period
      player.flashTimer = INVULN_TIME;
      break;                        // only one hit per frame
    }
  }
}

/* ==== 2️⃣ DOOR / ROOM SWITCHING ==== */
function checkDoorCollision(){
  for (const d of currentRoom.doors){
    const unlocked = (!d.requiredKills) || (kills >= d.requiredKills);
    if (!unlocked) continue;

    const inside = (
      player.x < d.x+d.w && player.x+player.w > d.x &&
      player.y < d.y+d.h && player.y+player.h > d.y
    );

    if (inside){
      const targetRoom = rooms[d.target];
      player.x = canvas.width/2 - player.w/2;
      player.y = canvas.height/2 - player.h/2;
      enemies = []; lastSpawn = 0;
      currentRoom = targetRoom;

      if (currentRoom === rooms.buildingC) maybePlaceKing();
      if (currentRoom === rooms.world) maybeAddBuildingC();
      if (currentRoom === rooms.world){
    // player left the castle – allow a fresh talk next time
    king.talked = false;      // <-- NEW (optional, but safe)
}
      return;
    }
  }
}

/* ==== add BUILDING C ==== */
function maybeAddBuildingC(){
  if (buildingCAdded) return;
  if (kills < 10) return;
  rooms.world.doors.push({
    x:200, y:140, w:80, h:80,
    target:"buildingC",
    emoji:"🏰"
  });
  buildingCAdded = true;
}

/* ==== POSITION THE KING (first time we enter castle) ==== */
function maybePlaceKing(){
  if (king.placed) return;
  king.x = canvas.width/2 - king.w/2;
  king.y = canvas.height/2 - king.h/2 - 250;
  king.placed = true;
}

/* ==== 1️⃣ ROOMS DEFINITION ==== */
const rooms = {
  world:{ name:"World", bg:"#4caf50", doors:[
      {x:30, y:540, w:80, h:80, target:"buildingA", emoji:"🏠"},
      {x:380, y:20, w:80, h:80, target:"buildingB", emoji:"🏢"}
    ], spawnEnemy(){ } },

  buildingA:{ name:"Building A", bg:"#8b4513", doors:[
      {x:200, y:660, w:80, h:80, target:"world", emoji:"🚪"}
    ], spawnEnemy(){},
    decor:[
      {x:150, y:300, emoji:"🪑"},
      {x:230, y:300, emoji:"🪑"},
      {x:190, y:460, emoji:"🛏️"}
    ] },

  buildingB:{ name:"Building B", bg:"#3b5998", doors:[
      {x:200, y:20, w:80, h:80, target:"world", emoji:"🚪",
       lockedEmoji:"🔒", requiredKills:10, showLock:true}
    ], spawnEnemy(){ spawnEnemy(); } },

  buildingC:{ name:"Building C", bg:"#d1e8f0", doors:[
      {x:200, y:660, w:80, h:80, target:"world", emoji:"🚪"}
    ], spawnEnemy(){ } }
};

let currentRoom = rooms.world;

/* ==== 3️⃣ DRAW ==== */
function draw(){
  /* background */
  ctx.fillStyle = currentRoom.bg;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  /* optional grid */
  ctx.strokeStyle='rgba(255,255,255,.08)';
  for(let x=0;x<canvas.width;x+=40){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
  }
  for(let y=0;y<canvas.height;y+=40){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
  }

  /* doors */
  ctx.font='48px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#000';
  currentRoom.doors.forEach(d=>{
    const unlocked = (!d.requiredKills) || (kills >= d.requiredKills);
    if (unlocked){
      ctx.fillText(d.emoji||'🚪', d.x+d.w/2, d.y+d.h/2);
    }else{
      const lock = d.lockedEmoji||'🔒';
      ctx.globalAlpha = 0.7;
      ctx.fillText(lock, d.x+d.w/2, d.y+d.h/2);
      ctx.globalAlpha = 1;
      if (d.showLock){
        ctx.font='20px Arial'; ctx.fillStyle='#ffcc00';
        ctx.fillText(`${d.requiredKills}`, d.x+d.w/2, d.y+d.h+14);
        ctx.font='48px Arial'; ctx.fillStyle='#fff';
      }
    }
  });

  /* room‑specific decor */
  if (currentRoom.decor && currentRoom.decor.length){
    ctx.font='36px Arial'; ctx.fillStyle='#fff';
    currentRoom.decor.forEach(item=> ctx.fillText(item.emoji, item.x, item.y));
  }

  /* player */
  ctx.font='30px Arial';
  // If we are flashing, draw the player in red; otherwise white
  if (player.flashTimer > 0){
    ctx.fillStyle = '#f44';
    player.flashTimer -= delta;   // delta comes from the loop (you may need to pass it)
  }else{
    ctx.fillStyle = '#fff';
  }
  ctx.fillText('🧿', player.x+player.w/2, player.y+player.h/2);

  /* king – only in the castle */
  if (currentRoom === rooms.buildingC){
    ctx.font='48px Arial'; ctx.fillStyle='#ffde59';
    ctx.fillText(king.emoji, king.x+king.w/2, king.y+king.h/2);
  }

  /* enemies */
  ctx.font='28px Arial';
  enemies.forEach(e=> ctx.fillText('👾', e.x+e.w/2, e.y+e.h/2));

  /* joystick visual aid */
  if (joystick.active){
    ctx.beginPath(); ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=3;
    ctx.arc(joystick.baseX, joystick.baseY, 40, 0, Math.PI*2); ctx.stroke();

    ctx.beginPath(); ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.arc(joystick.baseX+joystick.dx, joystick.baseY+joystick.dy, 20, 0, Math.PI*2);
    ctx.fill();
  }
/* draw the health bar on top of everything */
drawHealthBar();
}

/* ==== 4️⃣ MAIN LOOP ==== */
function loop(timestamp){
  if (!running) return;
  if (gamePaused){
    anim = requestAnimationFrame(loop);
    return;
  }
  const delta = timestamp - lastTime;
  lastTime = timestamp;

  document.getElementById('score').textContent = kills;

  if (timestamp - lastSpawn > 1200) { currentRoom.spawnEnemy(); lastSpawn = timestamp; }

  updatePlayer(); updateEnemies(); handleEnemyCollisions();
  updateKillEffects(delta);
  // ---- DAMAGE: choose the rule set depending on whether the bar is active ----
  if (showHealthBar){
    // after the king → health‑based damage
    damagePlayer(delta);
  }else{
    // before the king → instantaneous death on any touch (old behaviour)
    if (collide()){
      // --- GAME OVER (same as the block later) -----------------
      running = false;
      cancelAnimationFrame(anim);
      document.getElementById('final').innerHTML = `You scored ${kills}. <br>Hint: You need certain points to proceed in the game.`;
      document.getElementById('overlay').style.display = 'flex';
      recordPlaySession(playerName, kills);
      // hide the health bar just in case (it isn’t shown yet)
      showHealthBar = false;
      playerHealth   = 0;
      return;
    }
  }

  checkDoorCollision(); draw(); drawKillEffects();
 // ---- KING PROXIMITY -------------------------------------------------
if (currentRoom === rooms.buildingC && !king.active){
  const talkRange = 80;                     // pixels from king's centre
  const cx = king.x + king.w/2;
  const cy = king.y + king.h/2;
  const px = player.x + player.w/2;
  const py = player.y + player.h/2;
  const dist = Math.hypot(cx-px, cy-py);

  // ---- 1️⃣ START DIALOGUE ONLY IF we haven't talked yet ----
  if (dist < talkRange && !king.talked){
    king.active = true;
    startKingDialogue();                    // show the UI
  }

  // ---- 2️⃣ RESET the “talked” flag when we walk away ---------
  // (so the player can talk again after exiting and re‑entering)
  if (dist >= talkRange){
    king.talked = false;
  }
}

    // ---- END OF GAME when health reaches zero (only after the bar exists) ----
    if (showHealthBar && playerHealth <= 0){
      running = false;
      cancelAnimationFrame(anim);
      document.getElementById('final').innerHTML = `You scored ${kills}. <br>Hint: You need certain points to proceed in the game.`;
      document.getElementById('overlay').style.display = 'flex';
      pushScore(playerName, kills);

      // hide the health bar now that we’re dead
      showHealthBar = false;
      playerHealth   = 0;

      return;
    }
  anim = requestAnimationFrame(loop);
}

/* ==== START / RESTART ==== */
function startGame(){
  if (!playerName) askForName();
  document.getElementById('overlay').style.display = 'none';
  reset();
  running = true;
  requestAnimationFrame(loop);
}

/* ---- JOYSTICK INPUT ---- */
function pos(e){
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * canvas.width / r.width,
    y: (e.clientY - r.top)  * canvas.height/ r.height
  };
}
canvas.addEventListener('pointerdown', e=>{
  const p = pos(e);
  joystick.active = true;
  joystick.baseX = p.x; joystick.baseY = p.y;
  joystick.dx = joystick.dy = 0;
});
canvas.addEventListener('pointermove', e=>{
  if (!joystick.active) return;
  const p = pos(e);
  let dx = p.x - joystick.baseX,
      dy = p.y - joystick.baseY;
  const d = Math.hypot(dx,dy);
  if (d > joystick.max){ dx = dx/d * joystick.max; dy = dy/d * joystick.max; }
  joystick.dx = dx; joystick.dy = dy;
});
canvas.addEventListener('pointerup',()=>{ joystick.active=false; joystick.dx=0; joystick.dy=0; });
canvas.addEventListener('pointercancel',()=>{ joystick.active=false; });

/* ---- KEEP CANVAS ASPECT RATIO ---- */
function resize(){
  const maxW = Math.min(window.innerWidth,540);
  canvas.style.width  = maxW+'px';
  canvas.style.height = (maxW * 1170 / 540)+'px';
}
window.addEventListener('resize', resize);
resize();

/* ==== PAGE LOAD ==== */
window.addEventListener('load', async ()=>{
  const stored = localStorage.getItem('survivalPlayerName');
  if (stored){ playerName = stored; document.getElementById('playerName').textContent = playerName; }
  await refreshLeaderboard();

  // hide the dialogue box and grab the button (now it exists)
  document.getElementById('dialogueBox').style.display = 'none';
  dlgBtn = document.getElementById('dialogueNext');
  dlgBtn.addEventListener('click', advanceKingDialogue);

  startGame();
});

/* ---- OPTIONAL SERVICE‑WORKER ---- */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js')
    .catch(e=>console.warn('SW registration failed',e));
}

/* ---- PLAY AGAIN BUTTON ---- */
document.getElementById('retry').addEventListener('click', startGame);

/* ----- OPTIONAL: keep the E‑key as a fallback (you can delete) ----- */
window.addEventListener('keydown', e=>{
  if ((e.key === 'e' || e.key === 'E') &&
      document.getElementById('dialogueBox').style.display !== 'none'){
    advanceKingDialogue();
  }
});
</script>
</body>

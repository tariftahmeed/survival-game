<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Top Down Survival Mobile</title>
<style>
/* (your existing CSS – keep it exactly as you had it) */
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center}
header{width:100%;background:#223;color:#fff;text-align:center;padding:10px;font-size:20px;position:relative}
#leaderboard{position:fixed;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;padding:6px 10px;border-radius:6px;font-size:0.85rem;line-height:1.3}
#leaderboard h3{margin:0 0 4px 0;font-size:0.95rem;text-align:center}
#leaderboard ol{margin:0;padding-left:20px}
canvas{background:#4caf50;border:2px solid #222;touch-action:none;flex:1;max-width:100%;margin-top:4px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:center;flex-direction:column;color:#fff;text-align:center}
button{padding:12px 22px;font-size:18px;cursor:pointer}
</style>
</head>

<body>
<header>
  🎮 Survival – <span id="playerLabel">Player: <strong id="playerName"></strong></span>
  &nbsp;|&nbsp;Score: <span id="score">0</span>
</header>

<div id="leaderboard">
  <h3>Top 3</h3>
  <ol id="topList"></ol>
</div>

<canvas id="game" width="480" height="700"></canvas>

<div id="overlay"><h1>Game Over</h1><p id="final"></p><button id="retry">Play Again</button></div>

<!-- ====================== FIREBASE & FIRESTORE ====================== -->
<script type="module">
/* ---------- IMPORT THE SDK (v10.7) ---------- */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

/* ---------- YOUR FIREBASE CONFIG (copy‑paste from step 3) ---------- */
  const firebaseConfig = {
    apiKey: "AIzaSyA6QM9EX21aAG8fmlcv4_z5ZtvNblha-KM",
    authDomain: "survival-global-lb.firebaseapp.com",
    projectId: "survival-global-lb",
    storageBucket: "survival-global-lb.firebasestorage.app",
    messagingSenderId: "348885828075",
    appId: "1:348885828075:web:66ba19f95cb9347deb99ae"
  };

/* ---------- INITIALISE FIREBASE & GET Firestore ---------- */
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const scoresCol = collection(db, "survivalScores");   // will be created automatically on first write

/* ---------- LEADERBOARD HELPERS ---------- */
// Write a new (name,score) entry
async function pushScore(name, score){
  await addDoc(scoresCol,{name, score, ts: Date.now()});
  await refreshLeaderboard();          // refresh the UI right after we write
}

// Get the 3 highest scores (global)
async function fetchTop3(){
  const q = query(scoresCol, orderBy("score","desc"), limit(3));
  const snap = await getDocs(q);
  const list = [];
  snap.forEach(doc=>{ const d = doc.data(); list.push({name:d.name, score:d.score}); });
  return list;
}

// Render the top‑3 in the corner of the page
async function refreshLeaderboard(){
  const top = await fetchTop3();
  const ol = document.getElementById('topList');
  ol.innerHTML = "";
  top.forEach(entry=>{
    const li = document.createElement('li');
    li.textContent = `${entry.name}: ${entry.score}s`;
    ol.appendChild(li);
  });
}

/* ====================== GAME CODE ====================== */
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');

let player, enemies=[], score=0, startTime=0, lastSpawn=0, running=false, anim;
let playerName = '';
const joystick={active:false,baseX:0,baseY:0,dx:0,dy:0,max:60};

/* ---- PLAYER NAME (kept locally for convenience) ---- */
function askForName(){
  const stored = localStorage.getItem('survivalPlayerName');
  if(stored){ playerName = stored; }
  else{
    let name = '';
    while(!name){ name = prompt('Enter your name (will appear on the global leaderboard)'); }
    playerName = name.trim();
    localStorage.setItem('survivalPlayerName', playerName);
  }
  document.getElementById('playerName').textContent = playerName;
}

/* ---- BASIC GAME SETUP ---- */
function reset(){ player={x:220,y:330,w:30,h:30,speed:4.5}; enemies=[]; }
function spawnEnemy(){
  const side = Math.floor(Math.random()*4);
  let x,y;
  if(side===0){ x=Math.random()*canvas.width; y=-30; }
  if(side===1){ x=canvas.width+30; y=Math.random()*canvas.height; }
  if(side===2){ x=Math.random()*canvas.width; y=canvas.height+30; }
  if(side===3){ x=-30; y=Math.random()*canvas.height; }
  enemies.push({x,y,w:24,h:24,s:1.6});
}
function updatePlayer(){
  if(joystick.active){
    const mag = Math.hypot(joystick.dx, joystick.dy);
    if(mag>2){
      player.x += (joystick.dx/mag) * player.speed;
      player.y += (joystick.dy/mag) * player.speed;
    }
  }
  player.x = Math.max(0, Math.min(canvas.width-player.w, player.x));
  player.y = Math.max(0, Math.min(canvas.height-player.h, player.y));
}
function updateEnemies(){
  enemies.forEach(e=>{
    const dx = player.x - e.x,
          dy = player.y - e.y,
          d  = Math.hypot(dx,dy) || 1;
    e.x += (dx/d) * e.s;
    e.y += (dy/d) * e.s;
  });
}
function handleEnemyCollisions(){
  const toRemove = new Set();
  for(let i=0;i<enemies.length;i++){
    for(let j=i+1;j<enemies.length;j++){
      const a=enemies[i], b=enemies[j];
      if(a.x < b.x+b.w && a.x+a.w > b.x &&
         a.y < b.y+b.h && a.y+a.h > b.y){
        toRemove.add(i); toRemove.add(j);
      }
    }
  }
  enemies = enemies.filter((_,idx)=>!toRemove.has(idx));
}
function collide(){
  return enemies.some(e=>
    player.x < e.x+e.w && player.x+player.w > e.x &&
    player.y < e.y+e.h && player.y+player.h > e.y);
}

/* ---- DRAW ---- */
function draw(){
  ctx.fillStyle='#4caf50';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='rgba(255,255,255,.08)';
  for(let x=0;x<canvas.width;x+=40){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
  }
  for(let y=0;y<canvas.height;y+=40){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
  }
  ctx.fillStyle='gold';
  ctx.fillRect(player.x,player.y,player.w,player.h);
  ctx.fillStyle='#e53935';
  enemies.forEach(e=>ctx.fillRect(e.x,e.y,e.w,e.h));
  if(joystick.active){
    ctx.beginPath(); ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=3;
    ctx.arc(joystick.baseX,joystick.baseY,40,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.arc(joystick.baseX+joystick.dx, joystick.baseY+joystick.dy,20,0,Math.PI*2); ctx.fill();
  }
}

/* ---- MAIN LOOP ---- */
function loop(timestamp){
  if(!running) return;
  score = Math.floor((Date.now()-startTime)/1000);
  document.getElementById('score').textContent = score;
  if(timestamp - lastSpawn > 1200){ spawnEnemy(); lastSpawn = timestamp; }
  updatePlayer(); updateEnemies(); handleEnemyCollisions(); draw();
  if(collide()){
    running = false;
    cancelAnimationFrame(anim);
    document.getElementById('final').textContent = `You survived ${score} seconds`;
    document.getElementById('overlay').style.display = 'flex';
    // ----> RECORD THE RESULT GLOBALLY <----
    pushScore(playerName, score);
    return;
  }
  anim = requestAnimationFrame(loop);
}

/* ---- START / RESTART ---- */
function startGame(){
  if(!playerName) askForName();        // prompt only once per device
  document.getElementById('overlay').style.display = 'none';
  score = 0; startTime = Date.now(); lastSpawn = 0;
  reset(); running = true; requestAnimationFrame(loop);
}

/* ---- JOYSTICK INPUT (touch / mouse) ---- */
function pos(e){
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * canvas.width / r.width,
    y: (e.clientY - r.top)  * canvas.height/ r.height
  };
}
canvas.addEventListener('pointerdown',e=>{
  const p = pos(e);
  if(p.x < canvas.width/2){
    joystick.active = true;
    joystick.baseX = p.x; joystick.baseY = p.y; joystick.dx = joystick.dy = 0;
  }
});
canvas.addEventListener('pointermove',e=>{
  if(!joystick.active) return;
  const p = pos(e);
  let dx = p.x - joystick.baseX,
      dy = p.y - joystick.baseY;
  const d = Math.hypot(dx,dy);
  if(d > joystick.max){ dx = dx/d * joystick.max; dy = dy/d * joystick.max; }
  joystick.dx = dx; joystick.dy = dy;
});
canvas.addEventListener('pointerup',()=>{ joystick.active=false; joystick.dx=0; joystick.dy=0; });
canvas.addEventListener('pointercancel',()=>{ joystick.active=false; });

/* ---- KEEP CANVAS ASPECT RATIO ---- */
function resize(){
  const maxW = Math.min(window.innerWidth,480);
  canvas.style.width  = maxW+'px';
  canvas.style.height = (maxW * 700 / 480)+'px';
}
window.addEventListener('resize',resize);
resize();

/* ---- PAGE LOAD ----
   * Show stored player name (so the prompt isn’t shown repeatedly)
   * Load the **global** top‑3 from Firestore
   * Start the first round automatically
   ------------------------------------------------------- */
window.addEventListener('load',async()=>{
  const stored = localStorage.getItem('survivalPlayerName');
  if(stored){ playerName = stored; document.getElementById('playerName').textContent = playerName; }
  await refreshLeaderboard();    // pulls the *global* list from Firestore
  startGame();                   // auto‑start the first game
});

/* ---- OPTIONAL SERVICE‑WORKER (offline caching) ---- */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js')
    .catch(e=>console.warn('SW registration failed',e));
}
/* ---------- MODERN LISTENER FOR THE “Play Again” BUTTON ---------- */
document.getElementById('retry').addEventListener('click', startGame);
</script>
</body>
</html>
